name: Rainbow Notification Settings Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pages/notifications.vue'
      - 'app/components/identity-control.vue'
      - 'server/api/notifications/**'
      - 'utils/scripts/verifyNotificationSettings.test.ts'
      - '.github/workflows/notification-settings-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx utils/scripts/verifyNotificationSettings.test.ts
