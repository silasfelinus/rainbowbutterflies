name: Rainbow Auth Session Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/components/identity-control.vue'
      - 'app/app.vue'
      - 'server/api/auth/**'
      - 'server/routes/auth/**'
      - 'server/utils/authSession.ts'
      - 'server/utils/kindRobots.ts'
      - 'utils/authSessionContract.ts'
      - 'utils/scripts/verifyAuthSession.test.ts'
      - 'nuxt.config.ts'
      - '.env.example'
      - '.github/workflows/auth-session-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/components/identity-control.vue'
      - 'app/app.vue'
      - 'server/api/auth/**'
      - 'server/routes/auth/**'
      - 'server/utils/authSession.ts'
      - 'server/utils/kindRobots.ts'
      - 'utils/authSessionContract.ts'
      - 'utils/scripts/verifyAuthSession.test.ts'
      - 'nuxt.config.ts'
      - '.env.example'
      - '.github/workflows/auth-session-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-contract:
    name: Auth session contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=optional

      - name: Verify Rainbow auth session contract
        run: npx tsx utils/scripts/verifyAuthSession.test.ts
