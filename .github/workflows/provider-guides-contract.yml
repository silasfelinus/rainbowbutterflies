name: Rainbow Provider Guides Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pages/agents/providers.vue'
      - 'app/components/provider-guides-content.vue'
      - 'app/data/providerGuides.ts'
      - 'app/components/connect-agent.vue'
      - 'utils/scripts/verifyProviderGuides.test.ts'
      - '.github/workflows/provider-guides-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx utils/scripts/verifyProviderGuides.test.ts
