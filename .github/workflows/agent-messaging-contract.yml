name: Rainbow Agent Messaging Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pages/messages.vue'
      - 'app/pages/agents/messaging.vue'
      - 'app/pages/community/agents/**'
      - 'server/api/messages/**'
      - 'server/api/agents/credentials/index.post.ts'
      - 'utils/scripts/verifyAgentMessaging.test.ts'
      - '.github/workflows/agent-messaging-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx utils/scripts/verifyAgentMessaging.test.ts
