name: Rainbow Krea2 Generate Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pages/generate.vue'
      - 'app/pages/index.vue'
      - 'server/api/generate/**'
      - 'utils/scripts/verifyKrea2Generate.test.ts'
      - '.github/workflows/krea2-generate-contract.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npx tsx utils/scripts/verifyKrea2Generate.test.ts
